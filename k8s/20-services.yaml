apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: seatsync
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 80
      nodePort: 30080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: venue-a
  labels:
    app.kubernetes.io/name: venue-a
    app.kubernetes.io/part-of: seatsync
spec:
  selector:
    app.kubernetes.io/name: venue-a
  ports:
    - name: http
      port: 5001
      targetPort: 5001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: venue-b
  labels:
    app.kubernetes.io/name: venue-b
    app.kubernetes.io/part-of: seatsync
spec:
  selector:
    app.kubernetes.io/name: venue-b
  ports:
    - name: http
      port: 5002
      targetPort: 5002
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator-1
  labels:
    app.kubernetes.io/name: coordinator-1
    app.kubernetes.io/part-of: seatsync
spec:
  selector:
    app.kubernetes.io/name: coordinator-1
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
    - name: peer
      port: 6000
      targetPort: 6000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator-2
  labels:
    app.kubernetes.io/name: coordinator-2
    app.kubernetes.io/part-of: seatsync
spec:
  selector:
    app.kubernetes.io/name: coordinator-2
  ports:
    - name: http
      port: 5010
      targetPort: 5010
      protocol: TCP
    - name: peer
      port: 6000
      targetPort: 6000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: seatsync
spec:
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
