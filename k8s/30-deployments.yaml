apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: seatsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: seatsync
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: frontend-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: frontend-content
          configMap:
            name: seatsync-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-a
  labels:
    app.kubernetes.io/name: venue-a
    app.kubernetes.io/part-of: seatsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: venue-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: venue-a
        app.kubernetes.io/part-of: seatsync
    spec:
      containers:
        - name: venue
          image: seatsync-venue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: seatsync-app-config
          env:
            - name: VENUE_ID
              value: A
            - name: VENUE_NAME
              value: "Jai Ganesh, Akurdi"
            - name: PORT
              value: "5001"
            - name: CLOCK_SKEW_SECONDS
              value: "-3"
---
